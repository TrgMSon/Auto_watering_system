name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "mobile_app" ]
  pull_request:
    branches: [ "mobile_app" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename APK with timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release_$TIMESTAMP.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release_*.apk