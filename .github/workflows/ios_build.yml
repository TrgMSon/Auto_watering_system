# Build app iOS trên máy macOS của GitHub → file .ipa CHƯA KÝ.
# Cần đặt biến API_BASE_URL ở Settings → Secrets and variables → Actions → Variables,
# ví dụ https://api.example.com/api. Khi chạy tay có thể nhập địa chỉ khác.
name: iOS build (IPA chưa ký)

on:
  workflow_dispatch: # Cho phép trigger bằng tay
    inputs:
      api_base_url:
        description: 'Địa chỉ API (bỏ trống để dùng biến API_BASE_URL)'
        required: false
        type: string
  push:
    branches: [ 'mobile_app' ] # Chỉ chạy khi push lên nhánh mobile_app
    paths:
      - 'mobile/**'
      - '.github/workflows/ios_build.yml'
      - '!mobile/**/*.md'
      - '!mobile/test/**'
      - '!mobile/tool/**'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # để đăng file lên Releases

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}

    # Rất quan trọng: Báo cho GitHub Actions biết thư mục chứa Flutter project là "mobile"
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v5

      # Nếu thiếu địa chỉ, app sẽ gọi 10.0.2.2 và không kết nối được trên iPhone.
      - name: Kiểm tra địa chỉ API
        run: |
          case "$API_BASE_URL" in
            http://*|https://*) echo "API: $API_BASE_URL" ;;
            *)
              echo "::error::Chưa đặt API_BASE_URL hợp lệ (phải bắt đầu bằng http:// hoặc https://)."
              exit 1
              ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Cài thư viện
        run: flutter pub get

      - name: Tạo cấu trúc iOS (nếu dự án chưa có)
        run: flutter create --platforms=ios --org com.wateringsystem --project-name watering_app .

      - name: Cho phép gọi backend qua HTTP
        run: |
          case "$API_BASE_URL" in
            http://*)
              PLIST=ios/Runner/Info.plist
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Kết nối tới máy chủ tưới cây trong mạng nội bộ.'" "$PLIST"
              ;;
          esac

      - name: Build iOS (release, không ký)
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry watering-app-unsigned.ipa Payload
          ls -lh watering-app-unsigned.ipa

      - name: Đăng lên Releases (link tải cố định)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-latest-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" watering-app-unsigned.ipa --prerelease --target "$GITHUB_SHA" \
            --title "iOS mới nhất – $GITHUB_REF_NAME" \
            --notes "IPA chưa ký từ commit ${GITHUB_SHA::7} trên nhánh $GITHUB_REF_NAME. Tải về, cài lên iPhone bằng Sideloadly."
          echo "Link tải: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/watering-app-unsigned.ipa"

      - uses: actions/upload-artifact@v5
        with:
          name: watering-app-ios-unsigned
          # Do actions (ngoại trừ run) luôn lấy root repo làm gốc, ta cần trỏ vào thư mục mobile
          path: mobile/watering-app-unsigned.ipa
          retention-days: 14
