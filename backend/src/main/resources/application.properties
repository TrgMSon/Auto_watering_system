spring.application.name=backend

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# DATABASE
spring.datasource.driver-class-name = com.mysql.jdbc.Driver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA / HIBERNATE
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = none
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

#JWT
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}
app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS}

# MQTT
app.mqtt.enabled=true
app.mqtt.broker-url=${MQTT_BROKER_URL}
app.mqtt.username=${MQTT_USERNAME}
app.mqtt.password=${MQTT_PASSWORD}
app.mqtt.client.id=${MQTT_CLIENT_ID}
app.mqtt.command.topic=iot/garden/{deviceId}/cmd
app.mqtt.config.topic=iot/garden/{deviceId}/config

# EMQX Cloud Management API
app.emqx.management.base-url=${EMQX_MANAGEMENT_BASE_URL:}
app.emqx.management.api-key=${EMQX_API_KEY:}
app.emqx.management.api-secret=${EMQX_API_SECRET:}
app.emqx.management.authenticator-id=${EMQX_AUTHENTICATOR_ID:password_based:built_in_database}